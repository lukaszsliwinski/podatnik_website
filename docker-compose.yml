services:
  podatnik_website:
    build: .
    container_name: podatnik_website
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.podatnik_website.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.podatnik_website.entrypoints=websecure"
      - "traefik.http.routers.podatnik_website.tls.certresolver=le"
      - "traefik.http.services.podatnik_website.loadbalancer.server.port=${PORT}"
      - "traefik.http.middlewares.podatnik_website-hsts.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.podatnik_website-hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.podatnik_website-hsts.headers.stsPreload=true"
      - "traefik.http.routers.podatnik_website.middlewares=podatnik_website-hsts@docker"
    networks:
      - web
    expose:
      - "${PORT}"

networks:
  web:
    external: true
